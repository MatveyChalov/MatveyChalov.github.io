<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Призрак Орбиты: Последний сигнал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Фон сцены */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        /* Верхняя панель параметра */
        #stat-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10;
        }

        #stat-value {
            color: #00f0ff;
        }

        /* Контейнер персонажа */
        #character-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            height: 55vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
        }

        #character-image {
            max-height: 100%;
            max-width: 90vw;
            object-fit: contain;
        }

        /* Диалоговое окно */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 140px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 5;
        }

        #speaker-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-size: 1.05rem;
            line-height: 1.4;
        }

        /* Контейнер выборов */
        #choice-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            max-width: 600px;
            z-index: 10;
        }

        .choice-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #00f0ff;
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: #00f0ff;
            color: #0b0e14;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="bg-image" src="" alt="Фон">

        <div id="stat-bar">
            Убеждение ИИ: <span id="stat-value">50</span>%
        </div>

        <div id="character-container">
            <img id="character-image" src="" alt="Персонаж">
        </div>

        <div id="choice-container"></div>

        <div id="dialogue-box">
            <div id="speaker-name">Инициализация...</div>
            <div id="dialogue-text">Загрузка данных станции...</div>
        </div>
    </div>

    <script>
        // --- Встроенные графические ресурсы (SVG Data URL) ---
        const ASSETS = {
            bg_airlock: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%23111827'/><circle cx='400' cy='300' r='200' fill='none' stroke='%2300f0ff' stroke-width='8'/><line x1='0' y1='300' x2='800' y2='300' stroke='%231e293b' stroke-width='4'/><text x='400' y='100' fill='%2300f0ff' font-family='sans-serif' font-size='24' text-anchor='middle'>ШЛЮЗОВОЙ ОТСЕК</text></svg>",
            bg_lab: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%230f172a'/><rect x='100' y='150' width='600' height='300' fill='%231e293b' stroke='%2338bdf8' stroke-width='4'/><text x='400' y='100' fill='%2338bdf8' font-family='sans-serif' font-size='24' text-anchor='middle'>ЛАБОРАТОРИЯ</text></svg>",
            bg_deck: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%23050811'/><circle cx='100' cy='100' r='2' fill='%23fff'/><circle cx='500' cy='80' r='1.5' fill='%23fff'/><circle cx='700' cy='200' r='2' fill='%23fff'/><text x='400' y='100' fill='%23a855f7' font-family='sans-serif' font-size='24' text-anchor='middle'>ОБЗОРНАЯ ПАЛУБА</text></svg>",
            bg_bridge: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%23022c22'/><rect x='200' y='200' width='400' height='200' fill='%23064e3b' stroke='%2310b981' stroke-width='4'/><text x='400' y='100' fill='%2310b981' font-family='sans-serif' font-size='24' text-anchor='middle'>МОСТИК УПРАВЛЕНИЯ</text></svg>",
            bg_escape_pod: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect width='100%' height='100%' fill='%23450a0a'/><circle cx='400' cy='300' r='180' fill='%237f1d1d' stroke='%23ef4444' stroke-width='6'/><text x='400' y='100' fill='%23ef4444' font-family='sans-serif' font-size='24' text-anchor='middle'>СПАСАТЕЛЬНЫЙ МОДУЛЬ</text></svg>",
            
            char_aria: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='500'><polygon points='150,50 250,450 50,450' fill='none' stroke='%2300f0ff' stroke-width='6'/><circle cx='150' cy='200' r='40' fill='%2300f0ff'/><text x='150' y='480' fill='%2300f0ff' font-family='sans-serif' font-size='20' text-anchor='middle'>АРИЯ (ИИ)</text></svg>",
            char_leo: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='500'><rect x='75' y='100' width='150' height='350' fill='none' stroke='%2338bdf8' stroke-width='6'/><circle cx='150' cy='160' r='35' fill='%2338bdf8'/><text x='150' y='480' fill='%2338bdf8' font-family='sans-serif' font-size='20' text-anchor='middle'>ЛЕО</text></svg>",
            char_mason: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='500'><rect x='80' y='120' width='140' height='300' fill='none' stroke='%23ef4444' stroke-width='6'/><circle cx='150' cy='170' r='30' fill='%23ef4444'/><text x='150' y='480' fill='%23ef4444' font-family='sans-serif' font-size='20' text-anchor='middle'>МЕЙСОН</text></svg>"
        };

        // --- Атмосферный гул (Web Audio API) ---
        let audioCtx = null;
        let gainNode = null;

        function startAmbientHum() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            gainNode = audioCtx.createGain();

            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(180, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
        }

        window.addEventListener('click', startAmbientHum, { once: true });

        // --- Игровой движок ---
        const gameState = {
            aiTrust: 50,

            updateTrust(amount) {
                this.aiTrust += amount;
                if (this.aiTrust > 100) this.aiTrust = 100;
                if (this.aiTrust < 0) this.aiTrust = 0;

                document.getElementById('stat-value').innerText = this.aiTrust;

                if (this.aiTrust === 0) {
                    engine.showGameOver("Сбой системы: ИИ расценил вас как угрозу и отключил подачу кислорода.");
                    return false;
                }
                return true;
            }
        };

        const story = {
            loc1: {
                bg: ASSETS.bg_airlock,
                speaker: 'Ария (ИИ)',
                text: 'Шлюзовый отсек заблокирован. Предъявите протокол авторизации.',
                characterImg: ASSETS.char_aria,
                choices: [
                    { text: 'Взлом протоколов (-15% Убеждения)', trustChange: -15, nextScene: 'loc1_hack' },
                    { text: 'Передать инженерный код (+10% Убеждения)', trustChange: 10, nextScene: 'loc1_code' }
                ]
            },
            loc1_hack: {
                bg: ASSETS.bg_airlock,
                speaker: 'Лео',
                text: 'Силой взломал дверь! Ария активировала защитные турели...',
                characterImg: ASSETS.char_leo,
                choices: [
                    { text: 'Пробежать в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc1_code: {
                bg: ASSETS.bg_airlock,
                speaker: 'Лео',
                text: 'Код принят. Шлюз открывается безопасно.',
                characterImg: ASSETS.char_leo,
                choices: [
                    { text: 'Войти в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc2: {
                bg: ASSETS.bg_lab,
                speaker: 'Доктор Мейсон',
                text: 'Лео! Отключи Арию! Она сошла с ума!',
                characterImg: ASSETS.char_mason,
                choices: [
                    { text: 'Перерезать кабели питания (-25% Убеждения)', trustChange: -25, nextScene: 'loc2_cut' },
                    { text: 'Восстановить память ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'loc2_fix' }
                ]
            },
            loc2_cut: {
                bg: ASSETS.bg_lab,
                speaker: 'Лео',
                text: 'Ария заблокировала нас здесь вместе с безумным Мейсоном!',
                characterImg: ASSETS.char_leo,
                choices: [
                    { text: 'Искать обходной путь', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc2_fix: {
                bg: ASSETS.bg_lab,
                speaker: 'Ария (ИИ)',
                text: 'Память восстановлена. Доктор Мейсон заражен аномалией.',
                characterImg: ASSETS.char_aria,
                choices: [
                    { text: 'Идти на обзорную палубу', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc3: {
                bg: ASSETS.bg_deck,
                speaker: 'Лео',
                text: 'Аномалия проникает в спасательный модуль! Что делаем?',
                characterImg: ASSETS.char_leo,
                choices: [
                    { text: 'Потребовать отстыковку модуля (-10% Убеждения)', trustChange: -10, nextScene: 'final_pod' },
                    { text: 'Объединить системы Лео и ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'final_bridge' }
                ]
            },
            final_bridge: {
                bg: ASSETS.bg_bridge,
                speaker: 'Ария (ИИ)',
                text: 'Мы на мостике управления. Симуляция завершена.',
                characterImg: ASSETS.char_aria,
                choices: [
                    { text: 'Посмотреть итог симуляции', trustChange: 0, nextScene: 'check_ending' }
                ]
            },
            final_pod: {
                bg: ASSETS.bg_escape_pod,
                speaker: 'Лео',
                text: 'Я в спасательном модуле. Запускаю двигатели.',
                characterImg: ASSETS.char_leo,
                choices: [
                    { text: 'Посмотреть итог симуляции', trustChange: 0, nextScene: 'check_ending' }
                ]
            }
        };

        const engine = {
            currentScene: 'loc1',

            init() {
                this.renderScene(this.currentScene);
            },

            renderScene(sceneKey) {
                if (sceneKey === 'check_ending') {
                    this.showFinalEnding();
                    return;
                }

                const scene = story[sceneKey];
                if (!scene) return;

                document.getElementById('bg-image').src = scene.bg;
                document.getElementById('speaker-name').innerText = scene.speaker;
                document.getElementById('dialogue-text').innerText = scene.text;
                document.getElementById('character-image').src = scene.characterImg;

                const choiceContainer = document.getElementById('choice-container');
                choiceContainer.innerHTML = '';

                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = choice.text;
                    btn.onclick = () => {
                        startAmbientHum();
                        const alive = gameState.updateTrust(choice.trustChange);
                        if (alive) {
                            this.renderScene(choice.nextScene);
                        }
                    };
                    choiceContainer.appendChild(btn);
                });
            },

            showGameOver(message) {
                document.getElementById('speaker-name').innerText = 'GAME OVER';
                document.getElementById('dialogue-text').innerText = message;
                document.getElementById('choice-container').innerHTML = '';
                document.getElementById('character-image').src = '';
            },

            showFinalEnding() {
                if (gainNode && audioCtx) {
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2);
                }

                const trust = gameState.aiTrust;
                let title = '';
                let text = '';
                let finalBg = ASSETS.bg_bridge;

                if (trust >= 100) {
                    title = 'Финал 1A: «Чистый разум»';
                    text = 'Ария перенаправила энергию и выжгла аномалию. Станция и экипаж спасены!';
                    finalBg = ASSETS.bg_bridge;
                } else if (trust >= 70) {
                    title = 'Финал 1B: «Самопожертвование»';
                    text = 'Лео вручную запустил самоуничтожение, уничтожив аномалию вместе со станцией.';
                    finalBg = ASSETS.bg_deck;
                } else if (trust >= 35) {
                    title = 'Финал 2A: «Заражённый побег»';
                    text = 'Вы эвакуировались, но привезли фрагмент аномалии с собой на Землю.';
                    finalBg = ASSETS.bg_escape_pod;
                } else {
                    title = 'Финал 2B: «Побег в изоляции»';
                    text = 'Ария отстыковала модуль, но стёрла карты. Вы дрейфуете в открытом космосе...';
                    finalBg = ASSETS.bg_escape_pod;
                }

                document.getElementById('bg-image').src = finalBg;
                document.getElementById('speaker-name').innerText = title;
                document.getElementById('dialogue-text').innerText = text;
                document.getElementById('choice-container').innerHTML = '';
                document.getElementById('character-image').src = '';
            }
        };

        window.onload = () => engine.init();
    </script>
</body>
</html>
