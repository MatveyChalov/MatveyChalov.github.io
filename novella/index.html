<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Призрак Орбиты: Последний сигнал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #e2e8f0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #stat-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10;
        }

        #stat-value {
            color: #00f0ff;
        }

        #character-container {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 2;
        }

        #character-image {
            max-height: 100%;
            max-width: 90vw;
            object-fit: contain;
        }

        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 140px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 5;
        }

        #speaker-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-size: 1.05rem;
            line-height: 1.4;
        }

        #choice-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            max-width: 600px;
            z-index: 10;
        }

        .choice-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #00f0ff;
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: #00f0ff;
            color: #0b0e14;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <img id="bg-image" src="" alt="Фон">
        
        <div id="character-container">
            <img id="character-image" src="" alt="Персонаж" style="display: none;">
        </div>

        <div id="stat-bar">
            Убеждение ИИ: <span id="stat-value">50</span>%
        </div>

        <div id="choice-container"></div>

        <div id="dialogue-box">
            <div id="speaker-name">Инициализация...</div>
            <div id="dialogue-text">Загрузка данных станции... (Нажмите выбор для продолжения)</div>
        </div>
    </div>

    <script>
        const ASSETS = {
            bg: {
                airlock: 'assets/bg/airlock.png',
                lab: 'assets/bg/lab.png',
                deck: 'assets/bg/deck.png',
                bridge: 'assets/bg/bridge.png',
                escape_pod: 'assets/bg/escape_pod.png'
            },
            char: {
                aria: 'assets/characters/aria.png',
                leo: 'assets/characters/leo.png',
                mason: 'assets/characters/mason.png'
            }
        };

        let audioCtx = null;
        let gainNode = null;

        function startAmbientHum() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                gainNode = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(180, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
            } catch (e) {
                console.log("Ошибка аудио:", e);
            }
        }

        window.addEventListener('click', startAmbientHum, { once: true });

        const gameState = {
            aiTrust: 50,

            updateTrust(amount) {
                this.aiTrust += amount;
                if (this.aiTrust > 100) this.aiTrust = 100;
                if (this.aiTrust < 0) this.aiTrust = 0;

                document.getElementById('stat-value').innerText = this.aiTrust;

                if (this.aiTrust === 0) {
                    engine.showGameOver("Сбой системы: ИИ расценил вас как угрозу и отключил подачу кислорода.");
                    return false;
                }
                return true;
            }
        };

        const story = {
            loc1: {
                bgKey: 'airlock',
                speaker: 'Ария (ИИ)',
                text: 'Шлюзовый отсек заблокирован. Предъявите протокол авторизации.',
                charKey: 'aria',
                choices: [
                    { text: 'Взлом протоколов (-15% Убеждения)', trustChange: -15, nextScene: 'loc1_hack' },
                    { text: 'Передать инженерный код (+10% Убеждения)', trustChange: 10, nextScene: 'loc1_code' }
                ]
            },
            loc1_hack: {
                bgKey: 'airlock',
                speaker: 'Лео',
                text: 'Силой взломал дверь! Ария активировала защитные турели...',
                charKey: 'leo',
                choices: [
                    { text: 'Пробежать в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc1_code: {
                bgKey: 'airlock',
                speaker: 'Лео',
                text: 'Код принят. Шлюз открывается безопасно.',
                charKey: 'leo',
                choices: [
                    { text: 'Войти в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc2: {
                bgKey: 'lab',
                speaker: 'Доктор Мейсон',
                text: 'Лео! Отключи Арию! Она сошла с ума!',
                charKey: 'mason',
                choices: [
                    { text: 'Перерезать кабели питания (-25% Убеждения)', trustChange: -25, nextScene: 'loc2_cut' },
                    { text: 'Восстановить память ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'loc2_fix' }
                ]
            },
            loc2_cut: {
                bgKey: 'lab',
                speaker: 'Лео',
                text: 'Ария заблокировала нас здесь вместе с безумным Мейсоном!',
                charKey: 'leo',
                choices: [
                    { text: 'Искать обходной путь', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc2_fix: {
                bgKey: 'lab',
                speaker: 'Ария (ИИ)',
                text: 'Память восстановлена. Доктор Мейсон заражен аномалией.',
                charKey: 'aria',
                choices: [
                    { text: 'Идти на обзорную палубу', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc3: {
                bgKey: 'deck',
                speaker: 'Лео',
                text: 'Аномалия проникает в спасательный модуль! Что делаем?',
                charKey: 'leo',
                choices: [
                    { text: 'Потребовать отстыковку модуля (-10% Убеждения)', trustChange: -10, nextScene: 'final_pod' },
                    { text: 'Объединить системы Лео и ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'final_bridge' }
                ]
            },
            final_bridge: {
                bgKey: 'bridge',
                speaker: 'Ария (ИИ)',
                text: 'Мы на мостике управления. Подготовка к финальному расчету...',
                charKey: 'aria',
                choices: [
                    { text: 'Завершить симуляцию', trustChange: 0, nextScene: 'check_ending' }
                ]
            },
            final_pod: {
                bgKey: 'escape_pod',
                speaker: 'Лео',
                text: 'Я в спасательном модуле. Запускаю двигатели.',
                charKey: 'leo',
                choices: [
                    { text: 'Завершить симуляцию', trustChange: 0, nextScene: 'check_ending' }
                ]
            }
        };

        const engine = {
            currentScene: 'loc1',

            init() {
                this.renderScene(this.currentScene);
            },

            renderScene(sceneKey) {
                if (sceneKey === 'check_ending') {
                    this.showFinalEnding();
                    return;
                }

                const scene = story[sceneKey];
                if (!scene) return;

                const bgImg = document.getElementById('bg-image');
                bgImg.src = ASSETS.bg[scene.bgKey] || '';

                const charImg = document.getElementById('character-image');
                if (scene.charKey && ASSETS.char[scene.charKey]) {
                    charImg.src = ASSETS.char[scene.charKey];
                    charImg.style.display = 'block';
                } else {
                    charImg.style.display = 'none';
                }

                document.getElementById('speaker-name').innerText = scene.speaker;
                document.getElementById('dialogue-text').innerText = scene.text;

                const choiceContainer = document.getElementById('choice-container');
                choiceContainer.innerHTML = '';

                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = choice.text;
                    btn.onclick = () => {
                        startAmbientHum();
                        const alive = gameState.updateTrust(choice.trustChange);
                        if (alive) {
                            this.renderScene(choice.nextScene);
                        }
                    };
                    choiceContainer.appendChild(btn);
                });
            },

            showGameOver(message) {
                document.getElementById('bg-image').src = ASSETS.bg.escape_pod;
                document.getElementById('character-image').style.display = 'none';
                document.getElementById('speaker-name').innerText = 'GAME OVER';
                document.getElementById('dialogue-text').innerText = message;
                document.getElementById('choice-container').innerHTML = '';
            },

            showFinalEnding() {
                if (gainNode && audioCtx) {
                    try {
                        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                        gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                    } catch (e) {}
                }

                const trust = gameState.aiTrust;
                let title = '';
                let text = '';
                let finalBg = 'bridge';

                if (trust >= 100) {
                    title = 'Финал 1A: «Чистый разум»';
                    text = 'Ария перенаправила энергию и выжгла аномалию. Станция и экипаж спасены!';
                    finalBg = 'bridge';
                } else if (trust >= 70) {
                    title = 'Финал 1B: «Самопожертвование»';
                    text = 'Лео вручную запустил самоуничтожение, уничтожив аномалию вместе со станцией.';
                    finalBg = 'deck';
                } else if (trust >= 35) {
                    title = 'Финал 2A: «Заражённый побег»';
                    text = 'Вы эвакуировались, но привезли фрагмент аномалии с собой на Землю.';
                    finalBg = 'escape_pod';
                } else {
                    title = 'Финал 2B: «Побег в изоляции»';
                    text = 'Ария отстыковала модуль, но стёрла карты. Вы дрейфуете в открытом космосе...';
                    finalBg = 'escape_pod';
                }

                document.getElementById('bg-image').src = ASSETS.bg[finalBg];
                document.getElementById('character-image').style.display = 'none';
                document.getElementById('speaker-name').innerText = title;
                document.getElementById('dialogue-text').innerText = text;
                document.getElementById('choice-container').innerHTML = '';
            }
        };

        window.onload = () => engine.init();
    </script>
</body>
</html>
