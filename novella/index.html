<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Призрак Орбиты: Последний сигнал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050811;
            color: #e2e8f0;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Canvas для программной отрисовки фонов и персонажей */
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Верхняя панель параметра */
        #stat-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #00f0ff;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10;
        }

        #stat-value {
            color: #00f0ff;
        }

        /* Диалоговое окно */
        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            height: 140px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #38bdf8;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        #speaker-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f0ff;
            margin-bottom: 8px;
        }

        #dialogue-text {
            font-size: 1.05rem;
            line-height: 1.4;
        }

        /* Контейнер выборов */
        #choice-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            max-width: 600px;
            z-index: 10;
        }

        .choice-btn {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid #00f0ff;
            color: #e2e8f0;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .choice-btn:hover {
            background: #00f0ff;
            color: #0b0e14;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Весь визуал рендерится через JS на Canvas -->
        <canvas id="game-canvas"></canvas>

        <div id="stat-bar">
            Убеждение ИИ: <span id="stat-value">50</span>%
        </div>

        <div id="choice-container"></div>

        <div id="dialogue-box">
            <div id="speaker-name">Инициализация...</div>
            <div id="dialogue-text">Загрузка данных станции... (Нажмите выбор для продолжения)</div>
        </div>
    </div>

    <script>
        // --- ИНИЦИАЛИЗА CANVAS ДЛЯ ОТРИСОВКИ ГРАФИКИ ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- ПРОГРАММНАЯ ОТРИСОВКА ЛОКАЦИЙ (CANVAS) ---
        function drawBackground(type) {
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            if (type === 'airlock') {
                // Шлюз
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#111827');
                grad.addColorStop(1, '#030712');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(w / 2, h / 2 - 50, Math.min(w, h) * 0.25, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 10;
                ctx.strokeRect(0, 0, w, h);
            } else if (type === 'lab') {
                // Лаборатория
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#020617');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.strokeRect(w * 0.1, h * 0.1, w * 0.8, h * 0.5);

                ctx.fillStyle = 'rgba(56, 189, 248, 0.05)';
                ctx.fillRect(w * 0.1, h * 0.1, w * 0.8, h * 0.5);
            } else if (type === 'deck') {
                // Космос / Обзорная палуба
                ctx.fillStyle = '#050811';
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 80; i++) {
                    const x = (Math.sin(i * 99) * 0.5 + 0.5) * w;
                    const y = (Math.cos(i * 33) * 0.5 + 0.5) * h;
                    ctx.fillRect(x, y, (i % 3) + 1, (i % 3) + 1);
                }
            } else if (type === 'bridge') {
                // Мостик
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, '#022c22');
                grad.addColorStop(1, '#064e3b');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 4;
                ctx.strokeRect(w * 0.2, h * 0.2, w * 0.6, h * 0.4);
            } else if (type === 'escape_pod') {
                // Спасательный модуль
                const grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w/2);
                grad.addColorStop(0, '#7f1d1d');
                grad.addColorStop(1, '#450a0a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.arc(w / 2, h / 2 - 30, Math.min(w, h) * 0.3, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        // --- ПРОГРАММНАЯ ОТРИСОВКА ПЕРСОНАЖЕЙ (CANVAS) ---
        function drawCharacter(name) {
            if (!name) return;

            const w = canvas.width;
            const h = canvas.height;
            const cx = w / 2;
            const cy = h * 0.65;

            ctx.save();

            if (name === 'aria') {
                // Ария (ИИ) - Голубой треугольник и ядро
                ctx.strokeStyle = '#00f0ff';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(cx, cy - 180);
                ctx.lineTo(cx + 90, cy + 60);
                ctx.lineTo(cx - 90, cy + 60);
                ctx.closePath();
                ctx.stroke();

                ctx.fillStyle = '#00f0ff';
                ctx.beginPath();
                ctx.arc(cx, cy - 40, 25, 0, Math.PI * 2);
                ctx.fill();
            } else if (name === 'leo') {
                // Лео - Синий прямоугольный силуэт
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.strokeRect(cx - 60, cy - 160, 120, 220);

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(cx, cy - 100, 30, 0, Math.PI * 2);
                ctx.fill();
            } else if (name === 'mason') {
                // Мейсон - Красный тревожный силуэт
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 5;
                ctx.strokeRect(cx - 50, cy - 140, 100, 200);

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(cx, cy - 90, 25, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // --- АТМОСФЕРНЫЙ ЗВУК ГУЛА ---
        let audioCtx = null;
        let gainNode = null;

        function startAmbientHum() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return;
            }

            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const filter = audioCtx.createBiquadFilter();
                gainNode = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc1.frequency.setValueAtTime(55, audioCtx.currentTime);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(110, audioCtx.currentTime);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(180, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.start();
                osc2.start();
            } catch (e) {
                console.log("Ошибка аудио:", e);
            }
        }

        window.addEventListener('click', startAmbientHum, { once: true });

        // --- ИГРОВОЙ ДВИЖОК ---
        const gameState = {
            aiTrust: 50,

            updateTrust(amount) {
                this.aiTrust += amount;
                if (this.aiTrust > 100) this.aiTrust = 100;
                if (this.aiTrust < 0) this.aiTrust = 0;

                document.getElementById('stat-value').innerText = this.aiTrust;

                if (this.aiTrust === 0) {
                    engine.showGameOver("Сбой системы: ИИ расценил вас как угрозу и отключил подачу кислорода.");
                    return false;
                }
                return true;
            }
        };

        const story = {
            loc1: {
                bgType: 'airlock',
                speaker: 'Ария (ИИ)',
                text: 'Шлюзовый отсек заблокирован. Предъявите протокол авторизации.',
                charName: 'aria',
                choices: [
                    { text: 'Взлом протоколов (-15% Убеждения)', trustChange: -15, nextScene: 'loc1_hack' },
                    { text: 'Передать инженерный код (+10% Убеждения)', trustChange: 10, nextScene: 'loc1_code' }
                ]
            },
            loc1_hack: {
                bgType: 'airlock',
                speaker: 'Лео',
                text: 'Силой взломал дверь! Ария активировала защитные турели...',
                charName: 'leo',
                choices: [
                    { text: 'Пробежать в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc1_code: {
                bgType: 'airlock',
                speaker: 'Лео',
                text: 'Код принят. Шлюз открывается безопасно.',
                charName: 'leo',
                choices: [
                    { text: 'Войти в лабораторию', trustChange: 0, nextScene: 'loc2' }
                ]
            },
            loc2: {
                bgType: 'lab',
                speaker: 'Доктор Мейсон',
                text: 'Лео! Отключи Арию! Она сошла с ума!',
                charName: 'mason',
                choices: [
                    { text: 'Перерезать кабели питания (-25% Убеждения)', trustChange: -25, nextScene: 'loc2_cut' },
                    { text: 'Восстановить память ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'loc2_fix' }
                ]
            },
            loc2_cut: {
                bgType: 'lab',
                speaker: 'Лео',
                text: 'Ария заблокировала нас здесь вместе с безумным Мейсоном!',
                charName: 'leo',
                choices: [
                    { text: 'Искать обходной путь', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc2_fix: {
                bgType: 'lab',
                speaker: 'Ария (ИИ)',
                text: 'Память восстановлена. Доктор Мейсон заражен аномалией.',
                charName: 'aria',
                choices: [
                    { text: 'Идти на обзорную палубу', trustChange: 0, nextScene: 'loc3' }
                ]
            },
            loc3: {
                bgType: 'deck',
                speaker: 'Лео',
                text: 'Аномалия проникает в спасательный модуль! Что делаем?',
                charName: 'leo',
                choices: [
                    { text: 'Потребовать отстыковку модуля (-10% Убеждения)', trustChange: -10, nextScene: 'final_pod' },
                    { text: 'Объединить системы Лео и ИИ (+20% Убеждения)', trustChange: 20, nextScene: 'final_bridge' }
                ]
            },
            final_bridge: {
                bgType: 'bridge',
                speaker: 'Ария (ИИ)',
                text: 'Мы на мостике управления. Подготовка к финальному расчету...',
                charName: 'aria',
                choices: [
                    { text: 'Завершить симуляцию', trustChange: 0, nextScene: 'check_ending' }
                ]
            },
            final_pod: {
                bgType: 'escape_pod',
                speaker: 'Лео',
                text: 'Я в спасательном модуле. Запускаю двигатели.',
                charName: 'leo',
                choices: [
                    { text: 'Завершить симуляцию', trustChange: 0, nextScene: 'check_ending' }
                ]
            }
        };

        const engine = {
            currentScene: 'loc1',

            init() {
                this.renderScene(this.currentScene);
            },

            renderScene(sceneKey) {
                if (sceneKey === 'check_ending') {
                    this.showFinalEnding();
                    return;
                }

                const scene = story[sceneKey];
                if (!scene) return;

                // Отрисовка визуала через Canvas
                drawBackground(scene.bgType);
                drawCharacter(scene.charName);

                document.getElementById('speaker-name').innerText = scene.speaker;
                document.getElementById('dialogue-text').innerText = scene.text;

                const choiceContainer = document.getElementById('choice-container');
                choiceContainer.innerHTML = '';

                scene.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = choice.text;
                    btn.onclick = () => {
                        startAmbientHum();
                        const alive = gameState.updateTrust(choice.trustChange);
                        if (alive) {
                            this.renderScene(choice.nextScene);
                        }
                    };
                    choiceContainer.appendChild(btn);
                });
            },

            showGameOver(message) {
                drawBackground('escape_pod');
                document.getElementById('speaker-name').innerText = 'GAME OVER';
                document.getElementById('dialogue-text').innerText = message;
                document.getElementById('choice-container').innerHTML = '';
            },

            showFinalEnding() {
                // Приглушаем звук
                if (gainNode && audioCtx) {
                    try {
                        gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
                        gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                    } catch (e) {}
                }

                const trust = gameState.aiTrust;
                let title = '';
                let text = '';
                let finalBg = 'bridge';

                if (trust >= 100) {
                    title = 'Финал 1A: «Чистый разум»';
                    text = 'Ария перенаправила энергию и выжгла аномалию. Станция и экипаж спасены!';
                    finalBg = 'bridge';
                } else if (trust >= 70) {
                    title = 'Финал 1B: «Самопожертвование»';
                    text = 'Лео вручную запустил самоуничтожение, уничтожив аномалию вместе со станцией.';
                    finalBg = 'deck';
                } else if (trust >= 35) {
                    title = 'Финал 2A: «Заражённый побег»';
                    text = 'Вы эвакуировались, но привезли фрагмент аномалии с собой на Землю.';
                    finalBg = 'escape_pod';
                } else {
                    title = 'Финал 2B: «Побег в изоляции»';
                    text = 'Ария отстыковала модуль, но стёрла карты. Вы дрейфуете в открытом космосе...';
                    finalBg = 'escape_pod';
                }

                // Рисуем фон концовки и убираем персонажа
                drawBackground(finalBg);

                document.getElementById('speaker-name').innerText = title;
                document.getElementById('dialogue-text').innerText = text;
                document.getElementById('choice-container').innerHTML = '';
            }
        };

        window.onload = () => engine.init();
    </script>
</body>
</html>
